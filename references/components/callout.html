<!-- 标注框 -->
<!-- 用法：突出显示关键洞察，每模块最多 2 个 -->

<!-- 强调洞察 -->
<div class="callout callout-accent">
  <div class="callout-icon">💡</div>
  <div class="callout-content">
    <strong class="callout-title">关键洞察</strong>
    <p>这种将职责拆分为专注角色的模式，是软件工程中最重要的思想之一。工程师称之为"关注点分离"。</p>
  </div>
</div>

<!-- 信息提示 -->
<div class="callout callout-info">
  <div class="callout-icon">ℹ️</div>
  <div class="callout-content">
    <strong class="callout-title">值得了解</strong>
    <p>这个模式在大型项目中特别有用，因为它让代码更容易维护和测试。</p>
  </div>
</div>

<!-- 警告 -->
<div class="callout callout-warning">
  <div class="callout-icon">⚠️</div>
  <div class="callout-content">
    <strong class="callout-title">常见错误</strong>
    <p>不要在这里使用 async/await，因为它会导致消息通道过早关闭。</p>
  </div>
</div>

<!-- 变体：
- callout-accent: 朱红色边框，浅强调背景（用于 CS 洞察）
- callout-info: 青色边框，浅信息背景（用于"值得了解"）
- callout-warning: 红色边框，浅错误背景（用于常见错误）
-->
