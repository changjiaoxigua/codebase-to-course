<!-- 流程图 -->
<!-- 用法：水平展示流程步骤 -->

<div class="flow-steps">
  <div class="flow-step">
    <div class="flow-step-num">1</div>
    <p>用户点击按钮</p>
  </div>
  <div class="flow-arrow">→</div>
  <div class="flow-step">
    <div class="flow-step-num">2</div>
    <p>组件 A 检测点击</p>
  </div>
  <div class="flow-arrow">→</div>
  <div class="flow-step">
    <div class="flow-step-num">3</div>
    <p>发送请求到后端</p>
  </div>
  <div class="flow-arrow">→</div>
  <div class="flow-step">
    <div class="flow-step-num">4</div>
    <p>返回结果给用户</p>
  </div>
</div>

<!-- 注意：箭头在移动端会自动旋转为 ↓ -->
