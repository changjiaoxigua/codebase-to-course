<!-- 群聊动画 -->
<!-- 用法：iMessage/微信风格的组件对话，消息逐条显示 -->

<div class="chat-window" id="chat-UNIQUE_ID">
  <div class="chat-messages">
    <div class="chat-message" data-msg="0" data-sender="frontend" style="display:none">
      <div class="chat-avatar" style="background: var(--color-actor-1)">前</div>
      <div class="chat-bubble">
        <span class="chat-sender" style="color: var(--color-actor-1)">前端</span>
        <p>嘿后端，我需要这个项目的数据。</p>
      </div>
    </div>
    <div class="chat-message" data-msg="1" data-sender="backend" style="display:none">
      <div class="chat-avatar" style="background: var(--color-actor-2)">后</div>
      <div class="chat-bubble">
        <span class="chat-sender" style="color: var(--color-actor-2)">后端</span>
        <p>好的，我来查询数据库。</p>
      </div>
    </div>
    <div class="chat-message" data-msg="2" data-sender="database" style="display:none">
      <div class="chat-avatar" style="background: var(--color-actor-3)">数</div>
      <div class="chat-bubble">
        <span class="chat-sender" style="color: var(--color-actor-3)">数据库</span>
        <p>找到记录了，正在返回...</p>
      </div>
    </div>
  </div>

  <div class="chat-typing" id="chat-UNIQUE_ID-typing" style="display:none">
    <div class="chat-avatar" id="typing-avatar">?</div>
    <div class="chat-typing-dots">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>

  <div class="chat-controls">
    <button class="btn chat-next-btn">下一条消息</button>
    <button class="btn chat-all-btn">播放全部</button>
    <button class="btn chat-reset-btn">重播</button>
    <span class="chat-progress"></span>
  </div>
</div>

<!-- 注意：
- 每条消息需要 data-msg（序号）和 data-sender（发送者标识）
- 头像颜色使用 --color-actor-* 变量
- typing 元素的 id 必须是 {chat-window-id}-typing
-->
